{% extends "base.html" %}
{% block lab %}Лабораторная работа 5 — Flask и БД{% endblock %}
{% block main %}
<link rel="stylesheet" href="{{ url_for('static', filename='lab5/main.css') }}">
<section class="kb-wrap">
<h1>Создание статьи</h1>
<nav class="kb-nav"><a href="{{ url_for('lab5.home') }}">Главная</a><a href="{{ url_for('lab5.article_list') }}">Мои статьи</a><a href="{{ url_for('lab5.create') }}">Создать статью</a><a href="{{ url_for('lab5.public_articles') }}">Публичные статьи</a><a href="{{ url_for('lab5.users') }}">Пользователи</a>{% if user %}<a href="{{ url_for('lab5.profile') }}">Профиль</a><form action="{{ url_for('lab5.logout') }}" method="post"><button>Выйти</button></form>{% else %}<a href="{{ url_for('lab5.login') }}">Войти</a><a href="{{ url_for('lab5.register') }}">Регистрация</a>{% endif %}</nav>
{% if error %}<p class="kb-error">{{ error }}</p>{% endif %}<form method="post" class="kb-form"><label>Название статьи<input name="title" maxlength="50" value="{{ title or '' }}" required></label><label>Текст статьи<textarea name="article_text" rows="8" required>{{ article_text or '' }}</textarea></label><label class="kb-check"><input type="checkbox" name="is_favorite"> Избранная статья</label><label class="kb-check"><input type="checkbox" name="is_public"> Публичная статья</label><button>Сохранить</button></form>
</section>
{% endblock %}
