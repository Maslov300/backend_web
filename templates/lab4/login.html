{% extends "base.html" %}
{% block lab %}Авторизация{% endblock %}
{% block main %}
<h1>Вход</h1>{% if user %}<h2>Добро пожаловать, {{ user.name }}!</h2><form action="{{ url_for('lab4.logout') }}" method="post"><button type="submit">Выход</button></form><p><a href="{{ url_for('lab4.user_list') }}">Список пользователей</a></p>{% else %}<h2>Пожалуйста, авторизуйтесь</h2>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><p><label>Пользователь <input name="login" value="{{ login_value or '' }}"></label></p><p><label>Пароль <input type="password" name="password"></label></p><button type="submit">Войти</button> <button type="reset">Отмена</button></form><p><a href="{{ url_for('lab4.register') }}">Зарегистрироваться</a></p>{% endif %}
{% endblock %}
